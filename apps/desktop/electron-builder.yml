appId: chat.frith.desktop
productName: Frith
directories:
  app: .deploy
  output: release
asarUnpack:
  - "**/*.node"
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  extendInfo:
    NSCameraUsageDescription: Frith uses your camera when you join a call with video.
    NSMicrophoneUsageDescription: Frith uses your microphone when you join a call.
