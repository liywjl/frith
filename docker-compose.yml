services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      # 5433 on the host: avoids colliding with any locally-installed Postgres
      - "5433:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  dbdata:
