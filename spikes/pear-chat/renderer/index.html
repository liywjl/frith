<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lore P2P (spike)</title>
    <style>
      :root { --paper: #fafaf8; --line: #d5d3cc; --ink: #3a3833; --ink-soft: #8a867c; --ai: #0e7568; --ai-soft: #e3f0ed; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: var(--paper); color: var(--ink); font: 15px/1.5 -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; }
      header { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
      header b { font-size: 16px; }
      #status { color: var(--ink-soft); font-size: 13px; }
      #status.connected { color: var(--ai); }
      #feed { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
      .m { max-width: 60ch; }
      .m b { font-size: 13px; margin-right: 8px; }
      .m.mine b { color: var(--ai); }
      form { display: flex; gap: 8px; padding: 0 18px 16px; }
      input { flex: 1; font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; background: #fff; }
      input:focus { outline: none; border-color: var(--ai); }
      button { font: inherit; border: none; border-radius: 10px; padding: 0 18px; background: var(--ai); color: #fff; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <header>
      <b>Lore <small style="color:var(--ink-soft);font-weight:400">P2P spike</small></b>
      <span id="status">joining swarm…</span>
    </header>
    <div id="feed"></div>
    <form id="form">
      <input id="input" placeholder="Message the swarm…" autofocus />
      <button type="submit">Send</button>
    </form>
    <script src="app.js"></script>
  </body>
</html>
